# PowerSync sync rules for Maktab App. Paste into PowerSync dashboard → Sync Streams (sync config editor).
bucket_definitions:
  # head office admins: everything in their organization
  org_admin:
    parameters: SELECT organization_id AS org FROM app_member WHERE user_id = request.user_id() AND role = 'admin'
    data:
      - SELECT * FROM organization WHERE organization_id = bucket.org
      - SELECT * FROM setting WHERE organization_id = bucket.org
      - SELECT * FROM branch WHERE organization_id = bucket.org
      - SELECT * FROM academic_year WHERE organization_id = bucket.org
      - SELECT * FROM hijri_override WHERE organization_id = bucket.org
      - SELECT * FROM app_user WHERE organization_id = bucket.org
      - SELECT * FROM teacher WHERE organization_id = bucket.org
      - SELECT * FROM class WHERE organization_id = bucket.org
      - SELECT * FROM class_teacher WHERE organization_id = bucket.org
      - SELECT * FROM family WHERE organization_id = bucket.org
      - SELECT * FROM student WHERE organization_id = bucket.org
