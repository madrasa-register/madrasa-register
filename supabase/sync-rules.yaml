      - SELECT * FROM class_day WHERE organization_id = bucket.org
      - SELECT * FROM student_attendance WHERE organization_id = bucket.org
      - SELECT * FROM teacher_attendance WHERE organization_id = bucket.org
      - SELECT * FROM alert WHERE organization_id = bucket.org
      - SELECT * FROM eligibility_exception WHERE organization_id = bucket.org
