# Builds the signed Android app on every push to main and publishes it as a GitHub release.
# Permanent download link (always the newest version):
#   https://github.com/<owner>/<repo>/releases/latest/download/madrasa-register.apk
# Needs two repository secrets: KEYSTORE_BASE64 and KEYSTORE_PASSWORD.
name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - name: Version
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version").${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
      - run: npm run build
        env: { VITE_APP_VERSION: "${{ env.VERSION_NAME }}", VITE_RELEASE_REPO: "${{ github.repository }}" }
      - run: npx cap sync android
      - name: Signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks && echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Build APK and Play Store bundle
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease
        env: { KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}" }
      - run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/madrasa-register.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/madrasa-register.aab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: مدرسہ رجسٹر ${{ env.VERSION_NAME }}
          make_latest: true
          files: |
            out/madrasa-register.apk
            out/madrasa-register.aab
